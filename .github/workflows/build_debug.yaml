name: Debug Build
run-name: Build debug version

on:
  workflow_dispatch:
    inputs:
      job_target:
        description: "Select the platform"
        required: true
        type: choice
        options:
          - linux
          - windows
          - all
      release_version:
        description: "Specify the release version"
        required: true
        type: string

env:
  GODOT_VERSION: 4.3
  GODOT_PROJECT_LOCATION: src/project.godot
  EXPORT_FOLDER_LINUX: build/Linux
  EXPORT_FOLDER_WINDOWS: build/Windows
  APPLICATION_NAME: RiftStrike

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Setting extra variables
        run: |
          echo "DATE=$(date +'%Y-%m-d')" >> $GITHUB_ENV
          echo "MAIN_FOLDER=$(pwd)" >> $GITHUB_ENV
      - name: Installing dependencies
        run: pacman -Syu --noconfirm git bash yasm python python-pip scons gcc diffutils make wget unzip tar mingw-w64
      - name: Checkout submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare Godot
        run: |
          wget -q -O godot_linux.zip https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux_x86_64.zip
          unzip godot_linux.zip
          wget -q -O godot_export_templates.tpz https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}-stable
          unzip godot_export_templates.tpz -d ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}-stable
          mv ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}-stable
          unzip godot_export_templates.tpz -d ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}-stable/templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}-stable/
          echo "Configuring version: ${{ github.event.inputs.release_version }}"
          sed -i 's/config\/version="[^"]*"/config\/version="${{ github.event.inputs.release_version }}-debug"/' ${{ env.GODOT_PROJECT_LOCATION }}

      - name: Building debug Linux
        if: ${{ github.event.inputs.job_target == 'linux' || github.event.inputs.job_target == 'all' }}
        run: |
          mkdir -p ${{ env.EXPORT_FOLDER_LINUX }}
          ./Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux.x86_64 --import ${{ env.GODOT_PROJECT_LOCATION }} --quiet --headless --export-debug Linux ${{ env.MAIN_FOLDER }}/${{ env.EXPORT_FOLDER_LINUX }}/${{ env.APPLICATION_NAME }}.${{ github.event.inputs.release_version }}.linux_debug.x86_64.zip
      - name: Upload artifact debug Linux
        if: ${{ github.event.inputs.job_target == 'linux' || github.event.inputs.job_target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAIN_FOLDER }}/${{ env.EXPORT_FOLDER_LINUX }}/${{ env.APPLICATION_NAME }}.${{ github.event.inputs.release_version }}.linux_debug.x86_64.zip
          path: ${{ env.MAIN_FOLDER }}/${{ env.EXPORT_FOLDER_LINUX }}/${{ env.APPLICATION_NAME }}.${{ github.event.inputs.release_version }}.linux_debug.x86_64.zip

      - name: Building debug Windows
        if: ${{ github.event.inputs.job_target == 'windows' || github.event.inputs.job_target == 'all' }}
        run: |
          mkdir -p ${{ env.EXPORT_FOLDER_WINDOWS }}
          ./Godot_v${{ env.GODOT_VERSION }}-stable_mono_linux.x86_64 --import ${{ env.GODOT_PROJECT_LOCATION }} --quiet --headless --export-debug Windows ${{ env.MAIN_FOLDER }}/${{ env.EXPORT_FOLDER_WINDOWS }}/${{ env.APPLICATION_NAME }}.${{ github.event.inputs.release_version }}.windows_debug.x86_64.zip
      - name: Upload artifact debug Windows
        if: ${{ github.event.inputs.job_target == 'windows' || github.event.inputs.job_target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAIN_FOLDER }}/${{ env.EXPORT_FOLDER_LINUX }}/${{ env.APPLICATION_NAME }}.${{ github.event.inputs.release_version }}.windows_debug.x86_64.zip
          path: ${{ env.MAIN_FOLDER }}/${{ env.EXPORT_FOLDER_LINUX }}/${{ env.APPLICATION_NAME }}.${{ github.event.inputs.release_version }}.windows_debug.x86_64.zip
